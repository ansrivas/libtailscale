[package]
name = "tsnet"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Compile Tailscale into your program and get an entirely userspace IP address on a tailnet."
repository = "https://github.com/badboy/libtailscale"

build = "rust/build.rs"
include = [
  "/LICENSE",
  "/README.md",
  "/go.mod",
  "/go.sum",
  "/tailscale.go",
  "/tailscale.c",
  "/tailscale.h",
  "/rust/src",
  "/rust/examples",
  "/rust/build.rs",
]

[lib]
path = "rust/src/lib.rs"

[[example]]
name = "echo_client"
path = "rust/examples/echo_client.rs"

[[example]]
name = "echo_server"
path = "rust/examples/echo_server.rs"

[dependencies]
hyper = { version = "0.14.19", optional = true, features = ["server"] }
log = { version = "0.4", default-features = false }
nix = "0.26.2"
thiserror = "2"
tokio = { version = "1.44.2", optional = true, features = ["rt", "net"] }

[dev-dependencies]
env_logger = "0.11"

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:hyper"]
